# PR 에서 검사를 자동으로 돌린다.
#
# **이것이 없어서 문구를 공용으로 올렸다** (2026-09-03). 어긋나는 것을 테스트로만
# 막아 두면, 아무도 `npm test` 를 치지 않는 한 그 테스트는 주석과 같다.
# 올린 것은 CI 없이도 안전하지만 **가드 테스트들은 다르다** —
# `no-truncation`(글자를 자르지 않는다) · `no-dot-date`(날짜를 점으로 잇지 않는다) ·
# `shared-labels`(두 앱이 같은 문구를 쓴다)는 누가 돌려야 잡는다.
name: check

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# 같은 PR 에 연달아 밀어 넣으면 앞의 것은 멈춘다. 큐를 오래 잡지 않는다.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 개발 PC 와 같은 메이저로 맞춘다. 테스트가 `fs.globSync` 를 쓰는데
          # 22 에서는 실험 기능이라 경고가 뜬다.
          node-version: '24'
          cache: npm

      # 잠금 파일 그대로 설치한다. `npm install` 은 잠금을 고칠 수 있다.
      - run: npm ci

      # 타입은 앱마다 본다. 패키지에는 스크립트가 없어 `--if-present` 로 건너뛴다.
      - name: 타입 검사
        run: npm run typecheck --workspaces --if-present

      # 테스트는 서울이 아닌 타임존에서 돈다 (`vitest.config.mts` 가 박는다).
      # 한국 기기에서만 돌리면 「기기 타임존을 따라간다」는 버그가 전부 통과한다.
      - name: 테스트
        run: npm test

      # 타입이 통과해도 번들이 깨지는 경우가 있어 관리팀 화면은 실제로 빌드해 본다.
      # 모바일은 네이티브 빌드라 여기서 돌리지 않는다 — EAS 가 한다.
      - name: 관리팀 화면 빌드
        run: npm run build --workspace @hr/admin
